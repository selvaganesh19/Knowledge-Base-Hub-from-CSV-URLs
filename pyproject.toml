[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbhub"
version = "0.1.0"
description = "Harvest URLs from a CSV into a searchable knowledge base"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Starlette's TestClient deprecation notice is about a future httpx2 migration
    # and does not affect this suite.
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "logs", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "C4",  # comprehension improvements
    "UP",  # pyupgrade
    "SIM", # simplification
]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
    "B008", # FastAPI's Depends()/File() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is not used, but tests may assert loosely
